<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Standalone reset — replaces the host page skeleton this file was authored against. */
:root{color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Pipeline Strata</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#e9ecf1; --surface:#f7f9fc; --surface-2:#eef1f6; --edge:#c9d0dc;
  --ink:#151a23; --ink-2:#4e5a6b; --ink-3:#7d8798;
  --idea:#b4632c; --idea-soft:#b4632c22;
  --tool:#1f6f79; --tool-soft:#1f6f7920;
  --rock:#4453a0; --rock-soft:#4453a018;
  --p-de:#2f6fc4; --p-me:#c24a34; --p-ep:#2e8a5c; --p-rl:#7a4fb8;
  --band-1:#dfe4ec; --band-2:#e6eaf1; --band-3:#e1e6ee; --band-4:#e4e9f0; --band-5:#dbe0ea;
  --shadow:0 1px 2px #151a2310, 0 8px 24px #151a2312;
  --font-display:"Archivo Narrow",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1117; --surface:#161b25; --surface-2:#1c222e; --edge:#2c3542;
  --ink:#e7ecf4; --ink-2:#9aa7ba; --ink-3:#6f7d92;
  --idea:#e0964f; --idea-soft:#e0964f26;
  --tool:#54b6c0; --tool-soft:#54b6c022;
  --rock:#8e9be8; --rock-soft:#8e9be81c;
  --p-de:#5b9ceb; --p-me:#e8705a; --p-ep:#46b97e; --p-rl:#a683e0;
  --band-1:#141a24; --band-2:#181e29; --band-3:#151b26; --band-4:#171d28; --band-5:#121822;
  --shadow:0 1px 2px #0006, 0 10px 30px #0007;
}}
:root[data-theme="dark"]{
  --ground:#0e1117; --surface:#161b25; --surface-2:#1c222e; --edge:#2c3542;
  --ink:#e7ecf4; --ink-2:#9aa7ba; --ink-3:#6f7d92;
  --idea:#e0964f; --idea-soft:#e0964f26;
  --tool:#54b6c0; --tool-soft:#54b6c022;
  --rock:#8e9be8; --rock-soft:#8e9be81c;
  --p-de:#5b9ceb; --p-me:#e8705a; --p-ep:#46b97e; --p-rl:#a683e0;
  --band-1:#141a24; --band-2:#181e29; --band-3:#151b26; --band-4:#171d28; --band-5:#121822;
  --shadow:0 1px 2px #0006, 0 10px 30px #0007;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* ── chrome ───────────────────────────────────────────────── */
#bar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge)}
#brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
#brand h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:17px;
  letter-spacing:.14em;text-transform:uppercase}
#brand span{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.group{display:flex;align-items:center;gap:6px}
.glab{font-family:var(--font-display);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.chip{border:1px solid var(--edge);background:var(--surface);border-radius:999px;
  padding:4px 10px;font-size:11.5px;font-family:var(--font-mono);letter-spacing:.02em;
  color:var(--ink-2);line-height:1.4}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip.de[aria-pressed="true"]{background:var(--p-de);border-color:var(--p-de);color:#fff}
.chip.me[aria-pressed="true"]{background:var(--p-me);border-color:var(--p-me);color:#fff}
.chip.ep[aria-pressed="true"]{background:var(--p-ep);border-color:var(--p-ep);color:#fff}
.chip.rl[aria-pressed="true"]{background:var(--p-rl);border-color:var(--p-rl);color:#fff}
#q{border:1px solid var(--edge);background:var(--surface);border-radius:999px;
  padding:5px 12px;font:inherit;font-size:12.5px;color:var(--ink);width:170px}
#q::placeholder{color:var(--ink-3)}
#q:focus-visible,.chip:focus-visible,button:focus-visible,#panel a:focus-visible,
.node:focus-visible rect,.node:focus-visible circle{outline:2px solid var(--idea);outline-offset:2px}

/* ── stage ────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#atlas{width:100%;height:100%;display:block}

.band rect{stroke:var(--edge);stroke-width:1}
.band text{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.3em;
  fill:var(--ink-3);font-size:22px;font-weight:600}
.dist rect{fill:var(--surface);stroke:var(--edge);stroke-width:1.25}
.dist .dt{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.17em;
  fill:var(--ink);font-size:19px;font-weight:700}
.dist .dg{font-size:12.5px;fill:var(--ink-3)}
.dist .dtfar{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.09em;
  fill:var(--ink);font-size:56px;font-weight:700;text-anchor:middle;opacity:0}
.cluster text{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.2em;
  fill:var(--ink-3);font-size:12.5px;font-weight:600}
.cluster line{stroke:var(--edge);stroke-width:1;stroke-dasharray:2 4}

.flow{stroke:var(--ink-3);stroke-width:2.5;fill:none;opacity:.5}
.flow.dash{stroke-dasharray:7 6}
.flowlab{font-family:var(--font-mono);font-size:11px;fill:var(--ink-3)}

.link{stroke:var(--idea);stroke-width:1.6;opacity:0;pointer-events:none;
  transition:opacity .2s ease}
.link.on{opacity:.62}

.node{cursor:pointer}
.node .mk{stroke-width:1.5}
.node.idea .mk{fill:var(--idea-soft);stroke:var(--idea)}
.node.tool .mk{fill:var(--tool-soft);stroke:var(--tool)}
.node.rock .mk{fill:var(--rock-soft);stroke:var(--rock)}
.node .lab{font-size:13.5px;fill:var(--ink);text-anchor:middle;opacity:0;
  transition:opacity .18s ease;paint-order:stroke;stroke:var(--ground);stroke-width:3.5px}
.node.tool .lab{font-family:var(--font-mono);font-size:12.5px;fill:var(--tool)}
.node.rock .lab{font-size:15px;font-weight:600}
.node:hover .mk{stroke-width:2.6}
.node:hover .lab{opacity:1!important}
.node.sel .mk{stroke-width:3}
.node.sel .lab{opacity:1!important;font-weight:600}
.node .halo{fill:none;stroke:var(--idea);stroke-width:2;opacity:0}
.node.sel .halo{opacity:.85}

[data-z="mid"] .node.t0 .lab{opacity:1}
[data-z="near"] .node .lab{opacity:1}
[data-z="far"] .node{opacity:.5}
[data-z="far"] .dist .dt,[data-z="far"] .dist .dg,
[data-z="far"] .cluster,[data-z="far"] .flowlab{opacity:0}
[data-z="far"] .dist .dtfar{opacity:1}
[data-z="near"] .band text{opacity:.35}

#stage[data-kind="idea"] .node.tool,#stage[data-kind="tool"] .node.idea{opacity:.13;pointer-events:none}
#stage[data-kind="tool"] .node.rock{opacity:.13;pointer-events:none}
#stage[data-lens] .node{opacity:.12;pointer-events:none}
#stage[data-lens="de"] .node.p-de,#stage[data-lens="me"] .node.p-me,
#stage[data-lens="ep"] .node.p-ep,#stage[data-lens="rl"] .node.p-rl{opacity:1;pointer-events:auto}
#stage[data-lens="de"] .node.p-de .lab,#stage[data-lens="me"] .node.p-me .lab,
#stage[data-lens="ep"] .node.p-ep .lab,#stage[data-lens="rl"] .node.p-rl .lab{opacity:1}
#stage.searching .node{opacity:.1;pointer-events:none}
#stage.searching .node.hit{opacity:1;pointer-events:auto}
#stage.searching .node.hit .lab{opacity:1}
#stage.focused .node{opacity:.14}
#stage.focused .node.near,#stage.focused .node.sel{opacity:1}
#stage.focused .node.near .lab{opacity:1}

/* ── panel ────────────────────────────────────────────────── */
#panel{position:fixed;z-index:25;right:16px;top:calc(70px + env(safe-area-inset-top,0px));
  width:330px;max-height:calc(100% - 100px - env(safe-area-inset-top,0px));overflow:auto;
  background:var(--surface);border:1px solid var(--edge);border-radius:14px;
  box-shadow:var(--shadow);padding:18px}
#panel h2{margin:0 0 4px;font-size:19px;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
#panel h2.mono{font-family:var(--font-mono);font-size:16.5px}
#panel .meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
#panel .tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;
  border:1px solid var(--edge);border-radius:5px;padding:2px 6px;color:var(--ink-2)}
#panel .tag.k-idea{color:var(--idea);border-color:var(--idea)}
#panel .tag.k-tool{color:var(--tool);border-color:var(--tool)}
#panel .tag.k-rock{color:var(--rock);border-color:var(--rock)}
#panel p{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
#panel p.body{color:var(--ink)}
#panel h3{margin:14px 0 6px;font-family:var(--font-display);font-size:11px;
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
#panel .where{font-family:var(--font-mono);font-size:11.5px;line-height:1.7;color:var(--ink-2)}
#panel .rel{display:flex;flex-wrap:wrap;gap:6px}
#panel .rel button{border:1px solid var(--edge);background:var(--surface-2);border-radius:7px;
  padding:4px 8px;font-size:12px;text-align:left;color:var(--ink-2)}
#panel .rel button:hover{border-color:var(--idea);color:var(--ink)}
#panel ol{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink-2)}
#panel .legend{display:grid;gap:7px;font-size:12.5px;color:var(--ink-2)}
#panel .legend div{display:flex;align-items:center;gap:9px}
#panel .sw{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
#panel .sw.sq{border-radius:3px}
#close{position:absolute;right:12px;top:12px;border:0;background:none;color:var(--ink-3);
  font-size:20px;line-height:1;padding:2px 5px;border-radius:6px}
#close:hover{color:var(--ink);background:var(--surface-2)}
#tour{display:flex;align-items:center;gap:8px;margin-top:6px}
#tour button{border:1px solid var(--edge);background:var(--surface-2);border-radius:7px;
  padding:4px 10px;font-size:12px}
#tour span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}

/* ── minimap + zoom ───────────────────────────────────────── */
#mini{position:fixed;z-index:25;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:212px;background:var(--surface);border:1px solid var(--edge);border-radius:10px;
  padding:7px;box-shadow:var(--shadow);cursor:crosshair}
#mini svg{display:block;width:100%;height:auto}
#mini .mb{stroke:var(--edge);stroke-width:2}
#mini .md{fill:var(--ink-3);opacity:.3}
#mini .vp{fill:var(--idea);opacity:.16;stroke:var(--idea);stroke-width:5}
#zoom{position:fixed;z-index:25;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:6px}
#zoom button{width:34px;height:34px;border:1px solid var(--edge);background:var(--surface);
  border-radius:9px;font-size:15px;box-shadow:var(--shadow);display:grid;place-items:center}
#zoom button.wide{width:auto;padding:0 12px;font-size:12px;font-family:var(--font-mono)}
#zoom button:hover{border-color:var(--ink-3)}

@media (max-width:820px){
  #brand span{display:none}
  #panel{right:0;left:0;top:auto;bottom:0;width:auto;max-height:52%;border-radius:14px 14px 0 0}
  #mini{display:none}
  #zoom{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="bar">
  <div id="brand"><h1>Pipeline Strata</h1><span>an atlas of four codebases</span></div>
  <div class="group"><span class="glab">Show</span>
    <button class="chip" id="k-all" aria-pressed="true">all</button>
    <button class="chip" id="k-idea" aria-pressed="false">ideas</button>
    <button class="chip" id="k-tool" aria-pressed="false">tools</button>
  </div>
  <div class="group"><span class="glab">Lens</span>
    <button class="chip de" data-lens="de" aria-pressed="false">DE</button>
    <button class="chip me" data-lens="me" aria-pressed="false">ME</button>
    <button class="chip ep" data-lens="ep" aria-pressed="false">EP</button>
    <button class="chip rl" data-lens="rl" aria-pressed="false">RL</button>
  </div>
  <div class="group"><label class="glab" for="q">Find</label>
    <input id="q" type="search" placeholder="watermark, dbt, censoring…" autocomplete="off">
  </div>
  <button class="chip" id="traverse">Guided traverse ▸</button>
</div>

<div id="stage" data-z="mid" data-kind="all">
  <svg id="atlas" role="img" aria-label="An atlas of data-engineering ideas, tools and practices arranged in five strata: the streaming fast path, the main data chain, the machinery of orchestration, observation and machine learning, the surrounding engineering craft, and seven bedrock principles."></svg>
</div>

<aside id="panel" aria-live="polite"><div id="pbody"></div></aside>

<div id="mini" title="Click to move the view"><svg id="minisvg" viewBox="0 0 620 284"></svg></div>

<div id="zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zfit" class="wide">fit</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DATA
   Keys: i id · l label (| = line break) · k kind · d district
         x,y world position · t tier (1 = shown at mid zoom)
         p projects · b body · w where to look · n related ids
   ═══════════════════════════════════════════════════════════════════ */
const W = 6200, H = 2840;

const BANDS = [
  {i:'s1', l:'The fast path',  x:2100, y:90,   w:2220, h:460, f:'var(--band-1)'},
  {i:'s2', l:'The main chain', x:80,   y:590,  w:6040, h:630, f:'var(--band-2)'},
  {i:'s3', l:'The machinery',  x:80,   y:1260, w:6040, h:680, f:'var(--band-3)'},
  {i:'s4', l:'The craft',      x:80,   y:1960, w:6040, h:480, f:'var(--band-4)'},
  {i:'s5', l:'Bedrock',        x:80,   y:2460, w:6040, h:300, f:'var(--band-5)'}
];

const DISTRICTS = [
  {i:'stream',  l:'Streaming',        g:'unbounded, out of order, and you must decide when to stop waiting', x:2180,y:110,w:2060,h:410},
  {i:'ingest',  l:'Ingestion',        g:'getting it in, from a source that does not care about you',        x:120, y:610,w:1180,h:590},
  {i:'contract',l:'Contracts & shape',g:'what did we agree on, and what do we do when it breaks',           x:1360,y:610,w:1040,h:590},
  {i:'store',   l:'Storage & model',  g:'keeping it, and keeping what it used to say',                      x:2460,y:610,w:1400,h:590},
  {i:'transform',l:'Transformation',  g:'raw into something a person can query',                            x:3920,y:610,w:1080,h:590},
  {i:'serve',   l:'Serving',          g:'handing it over without getting in the pipeline’s way',            x:5060,y:610,w:1020,h:590},
  {i:'orch',    l:'Orchestration',    g:'what runs, when, in what order, and what happens when it fails',   x:120, y:1280,w:1780,h:640},
  {i:'observe', l:'Observation & quality', g:'knowing it worked, and knowing your checks are worth trusting',x:1960,y:1280,w:1900,h:640},
  {i:'ml',      l:'Machine learning', g:'mostly the discipline of not accidentally cheating',               x:3920,y:1280,w:2160,h:640},
  {i:'craft',   l:'Engineering craft',g:'applies to every band above it',                                   x:120, y:1980,w:5960,h:440},
  {i:'bedrock', l:'Bedrock',          g:'seven ideas everything above rests on',                            x:120, y:2480,w:5960,h:260}
];

const CLUSTERS = [
  {l:'Configuration', x:180, y:2050, w:1120},
  {l:'Environments',  x:1360,y:2050, w:1240},
  {l:'Testing',       x:2660,y:2050, w:1240},
  {l:'Delivery',      x:3960,y:2050, w:1180},
  {l:'Documentation', x:5200,y:2050, w:820}
];

const FLOWS = [
  {d:'M1300 900 H1360', l:''},
  {d:'M2400 900 H2460', l:''},
  {d:'M3860 900 H3920', l:''},
  {d:'M5000 900 H5060', l:''},
  {d:'M2900 610 V520', l:'events', dash:1},
  {d:'M3400 520 V610', l:'alerts · files', dash:1},
  {d:'M1000 1280 V1200', l:'schedules', dash:1},
  {d:'M1750 1280 V1200', l:'', dash:1},
  {d:'M2900 1280 V1200', l:'checks', dash:1},
  {d:'M4400 1280 V1200', l:'features', dash:1},
  {d:'M5600 1280 V1200', l:'predictions', dash:1}
];

const NODES = [];
const A = (...a) => NODES.push(...a);

/* ── BEDROCK ─────────────────────────────────────────────── */
A(
{i:'promises',l:'Every arrow|is a promise',k:'rock',d:'bedrock',x:500,y:2620,t:1,p:'de me ep rl',
 b:'A pipeline is boxes and arrows, and the arrows are the work. Each one delivers at-most-once, at-least-once, exactly-once or not really at all. Almost everything in practice is at-least-once plus deduplication, because it is cheap and it degrades gracefully. Name the promise per hop and write the table down.',
 w:'DE · TOUR.md §3 “delivery guarantees, hop by hop”',n:['idempotency','positions','dlq','dedup-two-counters','exactly-once-load']},
{i:'clocks',l:'Time is not|one thing',k:'rock',d:'bedrock',x:1330,y:2620,t:1,p:'de me ep rl',
 b:'One record carries five timestamps: when it happened, when the source published it, when you received it, when you stored it, when something computed over it. Add a sixth when the source changes its mind — what was true versus what was known. “How many orders on Tuesday” and “how many did we know about on Tuesday” are different questions, and one column called date answers neither reliably.',
 w:'DE · TOUR.md §2 “the three clocks”',n:['watermark','incremental-landing','bitemporal','asof-join','tz-day','drift-reference']},
{i:'keep-raw',l:'Keep the|original',k:'rock',d:'bedrock',x:2160,y:2620,t:1,p:'de me ep rl',
 b:'Land exactly what arrived, then interpret. The reason is not storage prices: schema drift should break your model, never your ingestion. Keeping the bytes buys replay after a parsing fix, a way to answer “the number is wrong”, and — when duplicates are the thing you are hunting — the evidence itself.',
 w:'RL · landing/ is never rewritten',n:['elt','landing-zone','dlq','bitemporal','file-drop']},
{i:'idempotency',l:'Doing it twice|must be safe',k:'rock',d:'bedrock',x:2990,y:2620,t:1,p:'de me ep rl',
 b:'Everything retries: networks drop, tasks fail, people run the script again. If a second run can corrupt the data you cannot operate the system, let alone leave it unattended. Not a property you hope for — a property you build, with a natural key and a conflict rule, a version guard, a whole-table replace, an atomic swap, or one transaction.',
 w:'RL · every write is INSERT OR IGNORE or a version-guarded upsert',n:['natural-key','upsert','atomic-swap','transaction','resume-dont-repeat']},
{i:'positions',l:'Remember where|you got to',k:'rock',d:'bedrock',x:3820,y:2620,t:1,p:'de ep rl',
 b:'Any consumer of a sequence must record its position, or it misses things or re-reads forever. Checkpoint, offset, cursor, high-water mark — same idea. The interesting question is not what you store but where: store it with the data it covers and you get exactly-once; store it anywhere else and you get a window in which they can disagree.',
 w:'DE · three consumers, three answers (TOUR.md §3)',n:['exactly-once-load','offset-retention','reset-together','bounded-slice']},
{i:'belief',l:'Truth|changes',k:'rock',d:'bedrock',x:4650,y:2620,t:1,p:'de rl',
 b:'A supplier says an order was €334, then a year later says €339. The naive UPDATE destroys your ability to reproduce last quarter’s report, to explain a model’s inputs, or to know how often they correct anything. The information was not wrong; it was superseded, and superseded is not the same as never having existed.',
 w:'RL · src_* append-only + cur_* current belief',n:['bitemporal','tombstone','scd2','asof-join','restatement']},
{i:'quality-means',l:'“Quality” is|six questions',k:'rock',d:'bedrock',x:5480,y:2620,t:1,p:'de me rl',
 b:'Is it here (freshness)? Is it shaped as agreed (schema)? Are the values individually possible (domains)? Do the pieces agree (integrity, reconciliation)? Is it plausible given history (statistical)? Has the meaning shifted (semantic)? Six questions, six kinds of check, and different homes in the pipeline for each.',
 w:'Guide §1.7',n:['freshness','tests-as-monitors','precision-recall','specificity','reconciliation','domains']}
);

/* ── INGESTION ───────────────────────────────────────────── */
A(
{i:'pull-push',l:'Pull or push,|batch or stream',k:'idea',d:'ingest',x:320,y:690,t:1,p:'de me ep rl',
 b:'Two independent axes. Pull is easier to operate — you choose when, you can retry, you can go back. Push is lower latency and less work for the sender, but you must be available when they send and you must notice when they do not.',

const mk = el('marker', {id: 'arw', viewBox: '0 0 10 10', refX: 9, refY: 5,
  markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse'});
mk.append(el('path', {d: 'M0 0 L10 5 L0 10 z', fill: 'currentColor'}));
defs.append(mk); world.append(defs);
for (const f of FLOWS) {
  gFlow.append(el('path', {d: f.d, class: 'flow' + (f.dash ? ' dash' : ''),
    'marker-end': 'url(#arw)', color: 'var(--ink-3)'}));
  if (f.l) {
    const m = f.d.match(/M(-?\d+) (-?\d+)/);
    const t = el('text', {class: 'flowlab', x: +m[1] + 10, y: +m[2] - 6}); t.textContent = f.l;
    gFlow.append(t);
  }
}

/* links (hidden until a node is selected) */
const seen = new Set(), linkEls = new Map();
for (const n of NODES) for (const m of (n.n || [])) {
  if (!byId[m]) continue;
  const key = [n.i, m].sort().join('~');
  if (seen.has(key)) continue; seen.add(key);
  const a = byId[n.i], b = byId[m];
  const ln = el('line', {class: 'link', x1: a.x, y1: a.y, x2: b.x, y2: b.y});
  gLinks.append(ln);
  for (const id of [n.i, m]) {
    if (!linkEls.has(id)) linkEls.set(id, []);
    linkEls.get(id).push(ln);
  }
}
const neighbours = id => {
  const s = new Set();
  for (const m of (byId[id].n || [])) if (byId[m]) s.add(m);
  for (const n of NODES) if ((n.n || []).includes(id)) s.add(n.i);
  return s;
};

/* nodes */
const nodeEls = {};
for (const n of NODES) {
  const cls = ['node', n.k, 't' + n.t, ...(LANDMARKS.has(n.i) ? ['t0'] : []),
    ...(n.p || '').split(' ').filter(Boolean).map(p => 'p-' + p)];
  const g = el('g', {class: cls.join(' '), transform: `translate(${n.x},${n.y})`,
    tabindex: '0', role: 'button', 'aria-label': n.l.replace(/\|/g, ' ')});
  g.append(el('circle', {class: 'halo', r: n.k === 'rock' ? 22 : 17}));
  if (n.k === 'tool') g.append(el('rect', {class: 'mk', x: -8, y: -8, width: 16, height: 16, rx: 4}));
  else g.append(el('circle', {class: 'mk', r: n.k === 'rock' ? 13 : 9}));
  const lines = n.l.split('|');
  const top = n.k === 'rock' ? 32 : 26;
  const t = el('text', {class: 'lab', y: top});
  lines.forEach((s, j) => {
    const ts = el('tspan', {x: 0, dy: j ? 17 : 0}); ts.textContent = s; t.append(ts);
  });
  g.append(t);
  g.addEventListener('click', e => { e.stopPropagation(); select(n.i); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); select(n.i); } });
  gNodes.append(g); nodeEls[n.i] = g;
}

/* ═══════════════════════════════════════════════════════════════════
   VIEW: pan, zoom, semantic tiers
   ═══════════════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
let k = 0.35, tx = 0, ty = 0;

function apply() {
  world.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
  stage.dataset.z = k < 0.32 ? 'far' : (k < 0.72 ? 'mid' : 'near');
  drawViewport();
}
function fit(pad = 40) {
  const r = stage.getBoundingClientRect();
  const top = 58;
  k = Math.min((r.width - pad * 2) / W, (r.height - top - pad * 2) / H);
  tx = (r.width - W * k) / 2;
  ty = top + (r.height - top - H * k) / 2;
  apply();
}
function zoomAt(cx, cy, f) {
  const nk = Math.max(0.08, Math.min(2.2, k * f));
  tx = cx - (cx - tx) * (nk / k); ty = cy - (cy - ty) * (nk / k); k = nk; apply();
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, {passive: false});

let drag = null;
const touches = new Map();
let pinch = null;
const spread = () => {
  const [a, b] = [...touches.values()];
  return {d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2};
};
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  stage.setPointerCapture(e.pointerId);
  if (touches.size === 2) { drag = null; pinch = spread(); stage.classList.remove('drag'); return; }
  drag = {x: e.clientX, y: e.clientY, tx, ty, moved: 0};
  stage.classList.add('drag');
});
stage.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pinch && touches.size === 2) {
    const s = spread();
    if (pinch.d > 0) zoomAt(s.cx, s.cy, s.d / pinch.d);
    pinch = s; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
function endPointer(e) {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (drag && drag.moved < 5 && e.target.closest('.node') === null) deselect();
  drag = null; stage.classList.remove('drag');
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

/* smooth move to a world point */
let anim = null;
function glide(wx, wy, nk) {
  const r = stage.getBoundingClientRect();
  const to = {k: nk, tx: r.width / 2 - wx * nk, ty: (r.height + 58) / 2 - wy * nk};
  const from = {k, tx, ty}, t0 = performance.now(), dur =
    matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 520;
  cancelAnimationFrame(anim);
  (function step(now) {
    const p = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = 1 - Math.pow(1 - p, 3);
    k = from.k + (to.k - from.k) * e;
    tx = from.tx + (to.tx - from.tx) * e;
    ty = from.ty + (to.ty - from.ty) * e;
    apply();
    if (p < 1) anim = requestAnimationFrame(step);
  })(t0);
}

/* ═══════════════════════════════════════════════════════════════════
   SELECTION + PANEL
   ═══════════════════════════════════════════════════════════════════ */
const pbody = document.getElementById('pbody');
let current = null, tourAt = -1;

function deselect() {
  current = null; tourAt = -1;
  stage.classList.remove('focused');
  document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  document.querySelectorAll('.node.near').forEach(n => n.classList.remove('near'));
  document.querySelectorAll('.link.on').forEach(l => l.classList.remove('on'));
  orientation();
}
function select(id, move) {
  const n = byId[id]; if (!n) return;
  current = id;
  document.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
  document.querySelectorAll('.node.near').forEach(x => x.classList.remove('near'));
  document.querySelectorAll('.link.on').forEach(l => l.classList.remove('on'));
  nodeEls[id].classList.add('sel');
  neighbours(id).forEach(m => nodeEls[m] && nodeEls[m].classList.add('near'));
  (linkEls.get(id) || []).forEach(l => l.classList.add('on'));
  stage.classList.add('focused');
  if (move) glide(n.x, n.y, Math.max(k, 0.78));
  panel(n);
}
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

function panel(n) {
  const tags = [`<span class="tag k-${n.k}">${n.k === 'rock' ? 'bedrock' : n.k}</span>`,
    `<span class="tag">${esc(distById[n.d].l)}</span>`,
    ...(n.p || '').split(' ').filter(Boolean)
      .map(p => `<span class="tag" style="color:var(--p-${p});border-color:var(--p-${p})">${PROJECTS[p][0]}</span>`)];
  const rel = [...neighbours(n.i)].map(m =>
    `<button data-go="${m}">${esc(byId[m].l.replace(/\|/g, ' '))}</button>`).join('');
  const tour = tourAt >= 0 ? `<div id="tour">
      <button data-tour="-1">◂ Prev</button><button data-tour="1">Next ▸</button>
      <span>${tourAt + 1} / ${TRAVERSE.length}</span>
      <button data-tour="x" style="margin-left:auto">End</button></div>` : '';
  pbody.innerHTML = `<button id="close" aria-label="Close">×</button>
    <h2${n.k === 'tool' ? ' class="mono"' : ''}>${esc(n.l.replace(/\|/g, ' '))}</h2>
    <div class="meta">${tags.join('')}</div>
    <p class="body">${esc(n.b)}</p>
    ${n.w ? `<h3>Where to look</h3><p class="where">${esc(n.w)}</p>` : ''}
    ${rel ? `<h3>Connects to</h3><div class="rel">${rel}</div>` : ''}
    ${tour}`;
}

function orientation() {
  pbody.innerHTML = `<h2>How to read this map</h2>
    <p>Five strata, bottom to top: the seven ideas everything rests on, the engineering craft
    around them, the machinery that drives the pipeline, the chain a record travels along, and
    streaming as a fast path overhead. Left to right is the journey of one record.</p>
    <p>Position carries the relationships, so the links stay hidden — <strong>select any node</strong>
    and only its own connections light up.</p>
    <h3>Marks</h3>
    <div class="legend">
      <div><span class="sw" style="background:var(--rock-soft);border:1.5px solid var(--rock)"></span>
        Bedrock idea — the seven foundations</div>
      <div><span class="sw" style="background:var(--idea-soft);border:1.5px solid var(--idea)"></span>
        Idea, practice or technique</div>
      <div><span class="sw sq" style="background:var(--tool-soft);border:1.5px solid var(--tool)"></span>
        A tool you would actually install</div>
    </div>
    <h3>Controls</h3>
    <ol>
      <li>Drag to pan, scroll to zoom. Labels appear as you zoom in.</li>
      <li><strong>Lens</strong> dims everything a given project does not demonstrate — the fastest way
      to see what is shared and what is specific.</li>
      <li><strong>Find</strong> searches names and text.</li>
      <li><strong>Guided traverse</strong> walks twenty stops in reading order.</li>
    </ol>
    <h3>The four codebases</h3>
    <div class="legend">${Object.entries(PROJECTS).map(([k2, v]) =>
      `<div><span class="sw" style="background:var(--p-${k2})"></span>
        <strong>${v[0]}</strong>&nbsp;·&nbsp;${v[1]}</div>`).join('')}</div>
    <p style="margin-top:14px;font-size:12.5px">${NODES.length} nodes across
    ${DISTRICTS.length} districts.</p>`;
}

pbody.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { tourAt = -1; select(go.dataset.go, true); return; }
  const t = e.target.closest('[data-tour]');
  if (t) {
    if (t.dataset.tour === 'x') { deselect(); return; }
    tourAt = (tourAt + (+t.dataset.tour) + TRAVERSE.length) % TRAVERSE.length;
    select(TRAVERSE[tourAt], true); return;
  }
  if (e.target.closest('#close')) deselect();
});
document.getElementById('traverse').addEventListener('click', () => {
  tourAt = 0; select(TRAVERSE[0], true);
});

/* ═══════════════════════════════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════════════════════════════ */
for (const id of ['all', 'idea', 'tool']) {
  document.getElementById('k-' + id).addEventListener('click', () => {
    stage.dataset.kind = id;
    ['all', 'idea', 'tool'].forEach(x =>
      document.getElementById('k-' + x).setAttribute('aria-pressed', String(x === id)));
  });
}
document.querySelectorAll('[data-lens]').forEach(b => {
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') === 'true';
    document.querySelectorAll('[data-lens]').forEach(x => x.setAttribute('aria-pressed', 'false'));
    if (on) delete stage.dataset.lens;
    else { stage.dataset.lens = b.dataset.lens; b.setAttribute('aria-pressed', 'true'); }
  });
});

const q = document.getElementById('q');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase();
  document.querySelectorAll('.node.hit').forEach(n => n.classList.remove('hit'));
  if (!v) { stage.classList.remove('searching'); return; }
  stage.classList.add('searching');
  let first = null;
  for (const n of NODES) {
    const hay = (n.l + ' ' + n.b + ' ' + (n.w || '') + ' ' + n.d).toLowerCase();
    if (hay.includes(v)) { nodeEls[n.i].classList.add('hit'); first = first || n; }
  }
  q.dataset.first = first ? first.i : '';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && q.dataset.first) { select(q.dataset.first, true); }
  if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});

/* ═══════════════════════════════════════════════════════════════════
   MINIMAP + ZOOM BUTTONS
   ═══════════════════════════════════════════════════════════════════ */
const mini = document.getElementById('minisvg');
for (const b of BANDS)
  mini.append(el('rect', {class: 'mb', x: b.x / 10, y: b.y / 10, width: b.w / 10,
    height: b.h / 10, rx: 2, fill: 'var(--surface-2)'}));
for (const d of DISTRICTS)
  mini.append(el('rect', {class: 'md', x: d.x / 10, y: d.y / 10, width: d.w / 10,
    height: d.h / 10, rx: 1}));
const vp = el('rect', {class: 'vp', rx: 3}); mini.append(vp);
function drawViewport() {
  const r = stage.getBoundingClientRect();
  vp.setAttribute('x', (-tx / k) / 10); vp.setAttribute('y', (-ty / k) / 10);
  vp.setAttribute('width', (r.width / k) / 10); vp.setAttribute('height', (r.height / k) / 10);
}
document.getElementById('mini').addEventListener('click', e => {
  const r = mini.getBoundingClientRect();
  glide((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H, Math.max(k, 0.5));
});
document.getElementById('zin').onclick = () => {
  const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.35); };
document.getElementById('zout').onclick = () => {
  const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.35); };
document.getElementById('zfit').onclick = () => fit();

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const step = 90;
  if (e.key === 'ArrowLeft') { tx += step; apply(); }
  else if (e.key === 'ArrowRight') { tx -= step; apply(); }
  else if (e.key === 'ArrowUp') { ty += step; apply(); }
  else if (e.key === 'ArrowDown') { ty -= step; apply(); }
  else if (e.key === '+' || e.key === '=') document.getElementById('zin').click();
  else if (e.key === '-') document.getElementById('zout').click();
  else if (e.key === 'Escape') deselect();
  else if (e.key === '/') { e.preventDefault(); q.focus(); }
  else return;
  e.preventDefault();
});
window.addEventListener('resize', drawViewport);

orientation();
fit();
</script>

</body>
</html>
