# ─────────────────────────────────────────────────────────────────────────────
# streaming/conf/log4j2.properties: Spark's JVM logging (mounted at
# /opt/spark/conf/log4j2.properties). Spark is chatty at INFO. WARN keeps the
# container log readable, so the job's own JSON lines (analyzer/logs.py, the
# "progress" lines) stand out. Set rootLogger.level = info to see everything.
# ─────────────────────────────────────────────────────────────────────────────
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSS} %p %c{1}: %m%n%ex

# Keep the line that says where the web UI is.
logger.ui.name = org.apache.spark.ui.SparkUI
logger.ui.level = info

# The Kafka client warns about every reconnect. Useful, but only when Kafka flaps.
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn
