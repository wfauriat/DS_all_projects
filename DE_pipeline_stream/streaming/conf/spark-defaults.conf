# ─────────────────────────────────────────────────────────────────────────────
# streaming/conf/spark-defaults.conf: Spark's own settings for the analyzer.
#
# Read by spark-submit inside the `spark` container, which mounts this file at
# /opt/spark/conf/spark-defaults.conf (see docker-compose.yml). Edit it, then
# `docker compose restart spark`. The job's own settings (topics, watermark,
# windows) are environment variables: see streaming/analyzer/config.py.
# ─────────────────────────────────────────────────────────────────────────────

# Where it runs: inside this one JVM, with 4 worker threads. That stands in for
# a cluster: spark://host:7077 (standalone) or k8s://… would distribute the same job.
spark.master                         local[4]
spark.app.name                       bikeshare-stream-analyzer
# In local mode the driver IS the executor: this is the whole heap.
spark.driver.memory                  1g

# Timestamps are parsed and written in UTC, like the source's.
spark.sql.session.timeZone           UTC

# Partitions for shuffles, i.e. for every stateful operator (windows, joins,
# dedup). The default 200 would mean 200 tiny state stores per operator.
# CAUTION: a checkpoint remembers this number. Changing it later requires
# wiping the checkpoints (`make spark-reset`).
spark.sql.shuffle.partitions         4

# State store: keep the state (open windows, join buffers, dedup keys) in
# RocksDB, off the JVM heap, rather than in hash maps that grow the heap.
spark.sql.streaming.stateStore.providerClass  org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
# Checkpoint only the changes of each batch instead of full snapshots.
spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled  true

# Keep a short history of batches in checkpoints and the UI: less disk and memory.
spark.sql.streaming.minBatchesToRetain  20
spark.sql.streaming.numRecentProgressUpdates  20

# Web UI (the Structured Streaming tab lives here). Published as http://localhost:4040.
spark.ui.port                        4040
spark.ui.showConsoleProgress         false

# The event schema is wide (a superset of every payload). Print plans in full
# instead of warning that they were truncated.
spark.sql.debug.maxToStringFields    100
