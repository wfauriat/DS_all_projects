# ─────────────────────────────────────────────────────────────────────────────
# Root of the uv workspace. It defines the LOCAL development environment only.
#
# Who reads this:
#   `uv lock` / `uv sync` / `uv run` on your machine, producing ./.venv.
#   Service images (Dockerfiles) do NOT read this root file. Each one installs
#   only its own workspace member from the shared uv.lock, e.g.
#   `uv sync --package bikeshare-sim`. Local dev and containers therefore run
#   exactly the same resolved versions.
#
# What lives where:
#   source/        package `bikeshare-sim`    the synthetic upstream API (the "vendor")
#   ingest/        package `bikeshare-bridge` SSE → Kafka bridge (first pipeline hop)
#   streaming/     Spark job code. It runs inside the Spark image, not installed here;
#                  its tests use the local pyspark from the `spark` group.
#   orchestration/ Airflow DAGs. They run inside the Airflow image, not installed here.
#   transform/     dbt project. It runs with dbt-duckdb (see the `warehouse` group).
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "de-modern"
version = "0.1.0"
description = "Modern streaming data pipeline scaffold (bike-share pretext)"
readme = "PLAN.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
# Virtual root: nothing to build or install at the top level. It only groups
# the members and the tooling below.
package = false
# `uv sync` installs these groups. `spark` is ~400 MB but a core part of the
# stack: the Spark rules are unit-tested locally (streaming/tests).
default-groups = ["dev", "warehouse", "spark", "dashboard"]

[tool.uv.workspace]
members = ["source", "ingest"]

# Resolve these names to the local workspace members (editable installs), not PyPI.
[tool.uv.sources]
bikeshare-sim = { workspace = true }
bikeshare-bridge = { workspace = true }

[dependency-groups]
# Everyday development: the two Python services plus the test and lint tools.
dev = [
    "bikeshare-sim",
    "bikeshare-bridge",
    "pytest>=8",
    "ruff>=0.6",
]
# Looking at and transforming the warehouse from the host: DuckDB, the dbt
# adapter, and harlequin (a terminal SQL IDE).
# duckdb is pinned to the Airflow image's version (orchestration/Dockerfile): the
# DuckDB file is written in Airflow and read here, so both sides must share a format.
# pyarrow: bulk inserts into DuckDB (orchestration/include/landing).
warehouse = [
    "duckdb==1.5.5",
    "pyarrow>=25",
    "dbt-core==1.12.5",  # = the Airflow image (orchestration/Dockerfile)
    "dbt-duckdb==1.11.0",
    "harlequin>=2",
]
# Local pyspark to unit-test the streaming rules without the Spark container.
# Same version as the Spark image (streaming/Dockerfile). Needs Java 17/21
# (Java 21 is installed on this host).
spark = [
    "pyspark==4.2.0",
]
# The Streamlit dashboard on the serving copy (dashboard/app.py, `make dashboard`).
# It shares uv.lock with the services: adding it moved websockets (used only by
# uvicorn[standard] in the source image, for WebSocket support the SSE API never uses).
# pandas < 3: Streamlit brings pandas in, and pyspark 4.2 (the `spark` group, same
# environment) warns that it does not fully support pandas 3.
dashboard = [
    "streamlit>=1.50",
    "pandas>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["source/tests", "ingest/tests", "streaming/tests", "orchestration/tests", "dashboard/tests"]
# importlib mode: both members can have tests/test_*.py with the same file
# names without clashing. Shared test helpers are therefore plain modules with
# unique names (source/tests/simkit.py, ingest/tests/bridgekit.py), put on the path here.
addopts = "--import-mode=importlib"
# "streaming" and "orchestration/include" make the Spark job's `analyzer` package and
# the DAGs' `landing` package importable by their tests.
pythonpath = ["source/tests", "ingest/tests", "streaming", "orchestration/include"]
filterwarnings = [
    # Third-party deprecations raised inside starlette's TestClient, not in our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
# Import blocks: stdlib / third-party / our packages / test helpers.
known-first-party = ["bikeshare_sim", "bikeshare_bridge", "analyzer", "landing", "serving"]
known-local-folder = ["simkit", "bridgekit"]

# For editors (Pyright / Pylance): analyse with the project's .venv, where the
# workspace members are installed as editable packages.
[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["source", "ingest"]
