# ─────────────────────────────────────────────────────────────────────────────
# config/source.toml: configuration of the synthetic bike-share source.
#
# Read by source/bikeshare_sim/config.py → load_settings(), once at startup.
#   path       $BIKESHARE_CONFIG, default "config/source.toml". The path is
#              relative to the working directory: the repo root locally, /app in
#              Docker (where ./config is mounted read-only, see
#              docker-compose.yml → source-api).
#   overrides  $SIM_SEED replaces [world].seed and $SIM_SPEED replaces
#              [clock].speed. Both are set in .env.
#
# What survives a restart (data/source/state.pkl): the world, the simulated
# time, the event log (so consumers can resume by seq) and the fault log.
# What is re-read from this file at every start: the clock speed and all of
# [faults]. Runtime tweaks made through /admin are therefore reset by a restart.
#
# Changing [world], [clock].start / step_seconds or [emission].status_interval_min
# makes the saved state incompatible. The source then starts a fresh world and
# keeps the old state as state.pkl.bak. `make source-reset` does the same on purpose.
# ─────────────────────────────────────────────────────────────────────────────

[world]
# Every random draw derives from this seed: the same seed and config always
# produce the same event stream.
seed = 42
n_stations = 40
n_bikes = 600
# Share of electric bikes. They ride faster, so their trips are shorter.
ebike_share = 0.35
# The fictional city of "Riverton": only its coordinates matter (lat, lon of the centre).
city_center = [45.0, 5.0]
city_radius_km = 4.0
# Average departures per station per simulated day, before the zone, size and
# weather factors. 75 × 40 stations ≈ 3,000 trips ≈ 6,000 trip events per day.
trips_per_station_day = 75.0
# Share of trips made by subscribers. The rest are casual riders, who ride slower.
member_share = 0.7

[clock]
# Simulated start: Monday 2026-03-02 05:00 UTC, just before the morning rush.
# The fictional city lives in UTC, so hour-of-day patterns read directly.
start = 2026-03-02T05:00:00Z
# Simulated seconds per real second: 60 = 1 sim-hour per real minute,
# 1440 = 1 sim-day per real minute. Change it live with `make speed x=600`.
speed = 60
# Engine resolution, in simulated seconds. Fixed steps keep the stream
# deterministic whatever the speed, pauses or fast-forwards.
step_seconds = 10
# How often, in real milliseconds, the engine catches up with the clock.
tick_ms = 200

[emission]
# Each station publishes a station_status snapshot every N simulated minutes.
# 40 stations × 288 per day ≈ 11,500 status events per day.
# The Spark analyzer needs this too, to know how many reports to expect:
# docker-compose.yml → spark → STATUS_INTERVAL_MIN.
status_interval_min = 5
# Operator trucks move bikes from full stations to empty ones every N
# simulated hours. This is silent: it only shows up in station_status.
rebalancing_every_h = 3
# Expected station capacity expansions per simulated day. They show up in
# /v1/stations through `updated_at`: slowly changing reference data (dbt snapshot).
capacity_changes_per_day = 0.2
# Events kept in memory for SSE resume (Last-Event-ID) and /v1/events replay.
# That is about 70 real minutes of stream at 60×.
buffer_size = 50000

# ── Faults ───────────────────────────────────────────────────────────────────
# There are two kinds:
#   per-event  `rate` is the probability that an eligible event is hit.
#   episode    `rate` is the expected number of episodes per simulated day.
# Change a fault live with PATCH /admin/faults/{name}, or force it once with
# POST /admin/faults/{name}/trigger (`make fault f=<name>`).
# Every injection is recorded in the ground-truth log (GET /admin/fault-log).

# per-event: any event is sent a second time, with the same event_id
[faults.duplicate]
enabled = true
rate = 0.004
# the copy follows the original by up to this many simulated seconds
max_delay_s = 300

# per-event: any event is held back before it is emitted
[faults.late_event]
enabled = true
rate = 0.003
# delay in simulated minutes (uniform range)
delay_min = [30, 180]

# per-event: a payload field is renamed, mistyped or missing
[faults.schema_drift]
enabled = true
rate = 0.001

# per-event: station_status reports more bikes than docks (70%) or fewer than zero (30%).
# A negative count breaks the contract (bikes_available ≥ 0), so the bridge
# rejects it. Only "more than capacity" needs the station reference data to
# detect (Spark, dbt).
[faults.impossible_status]
enabled = true
rate = 0.002

# per-event: a short trip_ended reports a far-away station (implied speed > 45 km/h).
# Only short trips are eligible, which is why the rate is higher than the others.
[faults.teleport]
enabled = true
rate = 0.01

# per-event: a trip_started or a trip_ended is never emitted
[faults.orphan_trip]
enabled = true
rate = 0.002

# episode: one station keeps repeating the same status while trips go on there
[faults.frozen_station]
enabled = true
rate = 0.5
duration_h = [1, 6]

# episode: one station stops publishing station_status
[faults.silent_station]
enabled = true
rate = 0.5
duration_h = [1, 6]

# episode: the whole stream stops, then flushes its backlog all at once
[faults.stream_stall]
enabled = true
rate = 0.3
duration_min = [15, 60]
