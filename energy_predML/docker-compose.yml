services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.9.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlflow_data
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/mlflow_data/mlflow.db
      --artifacts-destination /app/mlflow_data/artifacts
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./streamlit_app:/app/streamlit_app
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: >
      streamlit run streamlit_app/app.py
      --server.port 8501
      --server.address 0.0.0.0
    depends_on:
      mlflow:
        condition: service_healthy

  # ── One-shot pipeline services (docker-fetch / docker-train) ───────────────
  # These are not started by `docker compose up`. Run them explicitly:
  #   docker compose run --rm ingest
  #   docker compose run --rm train
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      - PREFECT_HOME=/tmp/prefect
    command: python -m src.workflows.ingest

  train:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
      # mlflow_data is NOT mounted here: artifacts are uploaded via the MLflow
      # HTTP proxy (--serve-artifacts), so the train container never writes to
      # the volume directly.
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: python -m src.workflows.train
    depends_on:
      mlflow:
        condition: service_healthy

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    profiles: ["tools"]
    volumes:
      - ./data:/app/data
    user: "${UID:-1000}:${GID:-1000}"
    env_file: .env
    command: python -m src.workflows.monitor

volumes:
  mlflow_data:
    # Docker-managed volume for the MLflow SQLite DB and model artifacts.
    # Used exclusively by the Docker workflow (docker-train / docker-serve).
    # The local workflow writes to ./mlflow_data/ on the host instead.
